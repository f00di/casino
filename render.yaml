services:
  - type: web
    name: friendly-card-room-server
    runtime: node
    plan: free
    numInstances: 1
    region: frankfurt
    # NODE_ENV=production makes npm ci skip devDependencies, but the build
    # needs TypeScript and migrations need tsx.
    buildCommand: npm ci --include=dev && npm run build
    # Free instances have no pre-deploy step. Migrations are idempotent
    # (applied files are skipped), so run them on every start.
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ROOM_TOKEN_PEPPER
        generateValue: true
      - key: ROOM_TTL_HOURS
        value: 24
      - key: LOG_LEVEL
        value: info
